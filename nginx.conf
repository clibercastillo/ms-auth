server {
    listen 80;
    server_name api.maderape.online;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.maderape.online;
    ssl_certificate /etc/letsencrypt/live/api.maderape.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.maderape.online/privkey.pem;
    resolver 127.0.0.11 valid=10s;

    location /api/auth {
        set $upstream_auth http://ms-auth:8080;
        proxy_pass $upstream_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/stadiums {
        set $upstream_stadium http://ms-stadium:8080;
        proxy_pass $upstream_stadium;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/bookings {
        set $upstream_bookings http://ms-bookings:8080;
        proxy_pass $upstream_bookings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/notifications {
        set $upstream_notif http://ms-notifications:8080;
        proxy_pass $upstream_notif;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
