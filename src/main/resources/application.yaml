server:
  port: 8080

spring:
  application:
    name: ms-auth
  datasource:
    url: jdbc:postgresql://localhost:5432/ms_auth_db
    username: ms_auth_user
    password: ms_auth_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: cambia-esta-clave-por-una-mucho-mas-larga-y-segura-en-produccion
  expiration: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html